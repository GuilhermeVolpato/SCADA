[platformio]
; Environment usado quando nenhum "-e" é passado (botões Build/Upload da barra de status)
default_envs = ambiente

; Opções comuns, herdadas por todos os [env:...] abaixo
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8

; Configuração do ESP32 de Ambiente
[env:ambiente]
; ${this.__env__} vira "ambiente" - compila só essa pasta + a shared
build_src_filter = +<esp32-${this.__env__}/${this.__env__}/> +<shared/>
lib_deps =
	${env.lib_deps}
	adafruit/DHT sensor library@^1.4.7

; Configuração do ESP32 de Segurança
[env:seguranca]
; ${this.__env__} vira "seguranca" - compila só essa pasta + a shared
build_src_filter = +<esp32-${this.__env__}/${this.__env__}/> +<shared/>